name: Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python scripts/collect-licenses.py
      - run: python scripts/fetch-license-texts.py
      - run: ./scripts/package-windows.ps1 -Target x86_64-pc-windows-msvc
      - run: rustc -vV | Out-File test-output-toolchain.txt; Get-ComputerInfo | Out-File -Append test-output-toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MyGoImage-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            test-output-toolchain.txt
  stable-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
