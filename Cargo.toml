[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
mygo-core = { path = "crates/core" }
mygo-scanner = { path = "crates/scanner" }
mygo-index = { path = "crates/index" }
mygo-decoder = { path = "crates/decoder" }
mygo-cache = { path = "crates/cache" }
mygo-scheduler = { path = "crates/scheduler" }
mygo-telemetry = { path = "crates/telemetry" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }

[profile.release]
lto = "thin"
strip = true

